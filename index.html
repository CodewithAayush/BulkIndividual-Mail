<!DOCTYPE html>
<html>
<head>
  <title>Bulk Mailer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    input, textarea, button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 100%;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input {
      flex: 1;
    }

    #log {
      height: 200px;
      overflow: auto;
      background: #111827;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📧 Bulk Resume Mailer</h2>

  <input id="email" placeholder="Your Gmail">
  <input id="password" placeholder="App Password" type="password">
  <input id="subject" placeholder="Subject">

  <textarea id="body" rows="6">
Hello {company},

I am a graphic designer and would like to apply...

Regards,
Your Name
  </textarea>

  <div class="row">
    <input type="file" id="resume">
    <input type="file" id="csv">
  </div>

  <button onclick="send()">Send Emails</button>

  <div id="log"></div>

</div>

<script src="renderer.js"></script>

</body>
</html>
